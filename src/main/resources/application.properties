spring.application.name=homesafe-claims-manager

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HomeSafeClaimsManager;encrypt=true;trustServerCertificate=true
spring.datasource.username=${HOMESAFE_DB_USERNAME}
spring.datasource.password=${HOMESAFE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
